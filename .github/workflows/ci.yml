name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Content is registered and in sync
        run: |
          npm run sync:content
          git diff --exit-code src/core/content/source.ts \
            || (echo "::error::source.ts is stale — run 'npm run sync:content' and commit the result" && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Validate content
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
