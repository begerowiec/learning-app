name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # ręczny redeploy z zakładki Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate content
        run: npm run validate:content

      - name: Build
        run: npm run build

      # Bez tego pusty build publikuje się tak samo cicho jak działający.
      - name: Check the build output
        run: |
          for f in dist/index.html dist/main.js dist/main.css; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          grep -q './main.js' dist/index.html \
            || { echo "::error::dist/index.html does not reference the built bundle"; exit 1; }
          echo "dist/ looks good:"; ls -lh dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4